spring.application.name=ticket-classifier

# Azure OpenAI settings. Values come from environment variables so no
# secret is ever hardcoded/committed. The ":" default means the app still
# starts if the env vars are unset - it will just skip straight to the
# keyword fallback whenever /classify is called.
azure.openai.endpoint=${AZURE_OPENAI_ENDPOINT:}
azure.openai.key=${AZURE_OPENAI_KEY:}
azure.openai.deployment=${AZURE_OPENAI_DEPLOYMENT:}
